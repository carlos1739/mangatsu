apiVersion: v1
kind: ConfigMap
metadata:
  name: mangatsu-config
data:
  DB_HOST: db
  DB_PORT: "3306"
  MANGADEX_API: https://api.mangadex.org
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
