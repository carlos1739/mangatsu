apiVersion: batch/v1
kind: Job
metadata:
  name: hpa-load-test
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: load
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              trap 'kill $(jobs -p) 2>/dev/null || true' EXIT
              for worker in 1 2 3 4 5 6 7 8; do
                (while true; do wget -q -O /dev/null http://api:5000/api/health || true; done) &
              done
              sleep 90
