name: Build and Push Docker Images

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Flutter web
        working-directory: project_manga
        run: |
          flutter pub get
          flutter build web --release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend_manga
          push: true
          tags: |
            carlossiregar/mangatsu-api:sha-${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && 'carlossiregar/mangatsu-api:latest' || '' }}
            ${{ github.ref == 'refs/heads/main' && 'carlossiregar/mangatsu-api:1.1' || '' }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./project_manga
          push: true
          tags: |
            carlossiregar/mangatsu-web:sha-${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && 'carlossiregar/mangatsu-web:latest' || '' }}
            ${{ github.ref == 'refs/heads/main' && 'carlossiregar/mangatsu-web:1.1' || '' }}
